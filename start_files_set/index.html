<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="utf-8">
    <title>COMP5347 Assignment One</title>
    <link rel="stylesheet" href="index.css" />
    <script type="text/javascript" src="index.js"></script>
</head>

<body>

    <h1 id="name">
        Online Book Shop
    </h1>

    <!-- darkmode -->
    <div id="darkModeToggle">
        <button type="button" onclick="toggleDarkMode()">Dark Mode</button>
    </div>

    <form method="get" action="">
        <div class="container1">

            <div id="searchBox">
                <input type="text" id="search-input">
                <button type="button" onclick="SearchBooks()">search</button>
            </div>

            <div id="filterBox">
                <select id="category-filter">
               <option value ="All ">Category</option>
               <option value ="Art">Art</option>
               <option value ="Science History ">Science History</option>
               <option value ="Action and Adventure ">Action and Adventure</option>
               <option value ="Health ">Health</option>
               <option value ="Science Fiction ">Science Fiction</option>
                </select>
                <button type="button " onclick="filterBooks() ">filter</button>
            </div>

            <div id="cartBox">
                <button type="button" onclick="addToCart()">Add to cart</button>
            </div>

            <div id="ResetBox">
                <button type="button" onclick="resetCart()">Reset the cart</button>
            </div>

            <div>
                <img src="images/shopping_cart.png" alt="Shopping Cart" class="cart-icon">
            </div>

            <div id="cartquantity">(0)
            </div>

        </div>

        <div class="container2">

            <div id="listBox ">
                <table id="book-table">
                    <thead>
                        <tr>
                            <th></th>
                            <!-- 复选框列，无表头显示 -->
                            <th></th>
                            <!-- 图片列，无表头显示 -->
                            <th class="title-column">Title</th>
                            <th></th>
                            <th>Authors</th>
                            <th>Year</th>
                            <th>Price</th>
                            <th>Publisher</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 书籍数据将被插入到这里 -->
                    </tbody>
                </table>
            </div>
        </div>
    </form>
</body>

</html>
