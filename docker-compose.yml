services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_PATH: /app/data/phones.db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-oldphonestore
      ORDER_TIMEOUT_MINUTES: "15"
      # Optional LLM (openai | deepseek | kimi) — leave unset for local RAG + tools
      # LLM_PROVIDER: deepseek
      # LLM_API_KEY:
      # LLM_MODEL: deepseek-chat
      # Kimi example:
      # LLM_PROVIDER: kimi
      # LLM_API_KEY:
      # LLM_MODEL: moonshot-v1-8k
      # OPENAI_API_KEY still works as an alias for LLM_API_KEY
    volumes:
      - phone-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  phone-data:
  redis-data:
